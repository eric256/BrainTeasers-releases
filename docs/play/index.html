<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open puzzle · Brain Teasers</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #f6f5f0; --card: #ffffff; --ink: #1d1f1b; --muted: #5f635b; --accent: #2e7d5b; --accent-ink: #ffffff; --line: #dcdcd3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121411; --card: #1c1f1b; --ink: #e6e6df; --muted: #a4a89f; --accent: #7fd1a6; --accent-ink: #0d2117; --line: #33372f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .logo { width: 56px; height: 56px; display: block; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .btn { display: block; text-align: center; text-decoration: none; font-weight: 600; padding: 14px 16px; border-radius: 999px; margin-top: 12px; }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .secondary { border: 1px solid var(--line); color: var(--ink); }
  code { font-size: 18px; letter-spacing: 0.04em; background: var(--bg); padding: 4px 8px; border-radius: 6px; }
  ol { padding-left: 20px; margin: 8px 0 0; }
  .muted { color: var(--muted); font-size: 14px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img class="logo" src="icon.png" alt="">
  <h1 id="title">Open this puzzle</h1>
  <p class="sub" id="what">in the free Brain Teasers app, with step-by-step hints</p>

  <div class="card">
    <strong>Have the app?</strong>
    <a class="btn primary" id="open" href="#">Open the puzzle</a>
  </div>

  <div class="card">
    <strong>Don't have it yet?</strong>
    <ol>
      <li>Download Brain Teasers (free, no ads, Android 8.0 or newer).</li>
      <li>Open it, tap <em>Have a puzzle code from a friend?</em> and enter:<br><code id="code">—</code></li>
    </ol>
    <a class="btn secondary" href="https://github.com/eric256/BrainTeasers-releases/releases/latest">Download the app</a>
    <p class="muted"><a href="../#installing">How to install</a></p>
  </div>
</main>
<script>
  // Puzzle codes look like ISL2v3-H85I4W0EY: game, size, generator version, difficulty and seed.
  const games = { PND: "Panda Pairs", SDK: "Sudoku", STR: "Star Battle", SUN: "Sun & Moon", SLT: "Slitherlink", TRL: "Trail",
    MIN: "Minesweeper", LUP: "Light Up", LNK: "Link Up", BRG: "Bridges", RCT: "Rectangles", TWR: "Towers", ISL: "Islands", PRL: "Pearls" };
  const levels = { E: "Easy", M: "Medium", H: "Hard", X: "Expert" };
  const raw = decodeURIComponent((location.hash || location.search.replace(/^\?(code=)?/, "")).replace(/^#/, ""));
  const m = raw.match(/^([A-Za-z]{3})([0-9])(?:v([0-9]{1,3}))?-([0-9A-Za-z]{1,14})(?:-([0-9A-Za-z]{1,6}))?$/);
  if (m) {
    const code = raw;
    document.getElementById("code").textContent = code;
    const game = games[m[1].toUpperCase()];
    const level = levels[m[4][0].toUpperCase()];
    if (game) {
      document.getElementById("title").textContent = game + (level ? " · " + level : "");
      document.title = game + " puzzle · Brain Teasers";
    }
    // Chrome on Android opens the app through an intent link, falling back to the download page.
    const fallback = encodeURIComponent("https://github.com/eric256/BrainTeasers-releases/releases/latest");
    const isAndroid = /Android/i.test(navigator.userAgent);
    document.getElementById("open").href = isAndroid
      ? "intent://puzzle/" + code + "#Intent;scheme=brainteasers;package=app.brainteasers.puzzles;S.browser_fallback_url=" + fallback + ";end"
      : "brainteasers://puzzle/" + code;
  } else {
    document.getElementById("title").textContent = "Brain Teasers";
    document.getElementById("what").textContent = "This link doesn't include a puzzle code.";
    document.getElementById("open").style.display = "none";
  }
</script>
</body>
</html>
